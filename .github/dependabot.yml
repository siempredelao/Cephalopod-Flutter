version: 2
updates:
  - package-ecosystem: pub
    directories:
      - /
      - /app
      - /packages/cephalopod_engine
    schedule:
      interval: weekly
    groups:
      pub-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
