name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.1

jobs:
  verify:
    name: Format, analyze, architecture, tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # The exact command developers run locally, so the two cannot drift.
      # It runs format check, analyze, architecture check, then engine (100%
      # line coverage) and app (85%) tests, stopping at the first failure.
      - name: Verify
        run: dart run melos run verify

  build:
    name: Smoke build (${{ matrix.platform }})
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: web
            command: >-
              flutter build web --release
              --base-href /${{ github.event.repository.name }}/
          - platform: android
            command: flutter build apk --debug
    steps:
      - uses: actions/checkout@v7

      # Platform folders come from `flutter create` (see README). Until they
      # are committed, this job reports a notice instead of failing.
      - name: Check for the platform folder
        id: platform
        run: |
          if [ -d "app/${{ matrix.platform }}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::app/${{ matrix.platform }} not found; skipping build."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.platform.outputs.present == 'true' && matrix.platform == 'android'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - if: steps.platform.outputs.present == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - if: steps.platform.outputs.present == 'true'
        name: Build
        working-directory: app
        run: ${{ matrix.command }}
