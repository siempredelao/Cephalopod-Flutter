name: cephalopod_engine
description: >-
  Rules engine for Cephalopod, the dice game by Mark Steere. Pure Dart with no
  Flutter dependency, so the rules can be tested and reused anywhere.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  collection: ^1.19.0
  meta: ^1.16.0

dev_dependencies:
  coverage: ^1.16.0
  # flutter_test pins test_api, and the workspace shares one resolution, so
  # leave room for pub to pick the `test` release that matches the SDK's pin.
  test: ^1.30.0
  very_good_analysis: ^10.3.0
