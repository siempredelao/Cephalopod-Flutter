name: cephalopod
description: >-
  Cephalopod, the two-player dice game by Mark Steere, built with Flutter.
version: 0.1.0+1
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  bloc: ^9.2.1
  cephalopod_engine: ^0.1.0
  collection: ^1.19.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  freezed_annotation: ^3.1.0
  go_router: ^18.1.0
  material_ui: ^1.7.0
  shared_preferences: ^2.5.3

dev_dependencies:
  bloc_test: ^10.0.0
  build_runner: ^2.15.0
  flutter_test:
    sdk: flutter
  # freezed 4.0.2+ needs analyzer 14, but the `test` version that Flutter
  # 3.47's flutter_test allows caps analyzer below 14, so pub picks 4.0.1.
  freezed: ^4.0.0
  shared_preferences_platform_interface: ^2.4.1
  very_good_analysis: ^10.3.0

flutter:
  uses-material-design: true
