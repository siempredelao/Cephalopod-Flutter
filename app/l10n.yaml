# Translations, generated by `flutter gen-l10n` (docs/adr/0017). The .arb
# files are the source; the Dart in `generated/` is rebuilt from them and
# never committed.
arb-dir: lib/core/l10n
template-arb-file: app_en.arb
output-dir: lib/core/l10n/generated
output-localization-file: app_localizations.dart
output-class: AppLocalizations
# English first, so a device in any other language gets English.
preferred-supported-locales: [en]
# AppLocalizations.of never returns null: every screen is inside the app.
nullable-getter: false
# Formatted like the rest of the code, so `melos run format:check` passes.
format: true
